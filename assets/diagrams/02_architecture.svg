<rect x="0" y="0" width="960" height="560" rx="14" fill="#FFFFFF"/><text x="480.0" y="40" font-size="22" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">The Hermes profiling architecture</text><text x="480.0" y="64" font-size="14" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">bash utils/helper.sh brings up the agent runtime, hermes-otel, MLflow, Grafana LGTM and the dashboard</text><rect x="40" y="96" width="380" height="120" rx="12" fill="#FDECEC" stroke="#ED1C24" stroke-width="1.5" filter="url(#shadow)"/><text x="230" y="124" font-size="16" fill="#ED1C24" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Agent runtime</text><text x="230" y="150" font-size="15" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Hermes Agent</text><text x="230" y="172" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">vLLM · Muse-Glimmer-30B</text><text x="230" y="196" font-size="12.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">plans, reasons, picks and calls tools</text><rect x="540" y="96" width="380" height="120" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="1.5" filter="url(#shadow)"/><text x="730" y="124" font-size="16" fill="#2E6DB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Telemetry</text><text x="730" y="150" font-size="15" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">hermes-otel</text><text x="730" y="172" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">OTel spans + CPU% (psutil)</text><text x="730" y="196" font-size="12" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">+ AMD GPU metrics (amdsmi), every 0.1s</text><text x="480" y="146" font-size="10" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">instruments</text><line x1="420" y1="156" x2="540" y2="156" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="250" width="380" height="144" rx="12" fill="#F4F5F7" stroke="#D9DCE1" stroke-width="1.5" filter="url(#shadow)"/><text x="230" y="274" font-size="14" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">TTS tools the agent calls</text><line x1="230" y1="216" x2="230" y2="250" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="292" y="242" font-size="11" fill="#5B6270" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">calls as a tool</text><rect x="54" y="286" width="160" height="94" rx="10" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="1.5"/><text x="134" y="310" font-size="14.5" fill="#2E6DB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Edge TTS</text><text x="134" y="330" font-size="12" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">cloud baseline</text><text x="134" y="348" font-size="11.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">network round-trip</text><text x="230" y="338" font-size="13.5" fill="#5B6270" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">or</text><rect x="246" y="286" width="160" height="94" rx="10" fill="#E9F7F8" stroke="#1EAAB4" stroke-width="1.5"/><text x="326" y="310" font-size="14.5" fill="#1EAAB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Kokoro server</text><text x="326" y="330" font-size="12" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">local on MI300X</text><text x="326" y="348" font-size="11.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">model resident in VRAM</text><text x="326" y="366" font-size="11.5" fill="#1EAAB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">sequential → batched</text><rect x="540" y="250" width="182" height="96" rx="12" fill="#F4F5F7" stroke="#1A1A1A" stroke-width="1.5" filter="url(#shadow)"/><text x="631" y="277" font-size="15" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">MLflow</text><text x="631" y="299" font-size="12.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">traces :5004</text><text x="631" y="319" font-size="12" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">spans + timings</text><line x1="631" y1="216" x2="631" y2="250" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="238" font-size="10.5" fill="#5B6270" font-weight="normal" text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif">traces</text><rect x="738" y="250" width="182" height="96" rx="12" fill="#FEF3E6" stroke="#F08418" stroke-width="1.5" filter="url(#shadow)"/><text x="829" y="275" font-size="14" fill="#F08418" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Grafana LGTM</text><text x="829" y="296" font-size="12" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">OTLP metrics :4318</text><text x="829" y="315" font-size="11.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">one container:</text><text x="829" y="332" font-size="11" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Prometheus :9090 · UI :3000</text><line x1="829" y1="216" x2="829" y2="250" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="860" y="238" font-size="10.5" fill="#5B6270" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">metrics</text><rect x="260" y="442" width="440" height="82" rx="12" fill="#FDECEC" stroke="#ED1C24" stroke-width="1.5" filter="url(#shadow)"/><text x="480" y="470" font-size="16" fill="#ED1C24" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Telemetry dashboard  ·  Streamlit :8501</text><text x="480" y="496" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">one view of the run: spans, CPU/GPU timeline, tool breakdown</text><line x1="600" y1="346" x2="500" y2="442" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="520" y="400" font-size="10.5" fill="#5B6270" font-weight="normal" text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif">spans</text><line x1="829" y1="346" x2="640" y2="442" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="770" y="400" font-size="10.5" fill="#5B6270" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">CPU / GPU :9090</text><text x="480.0" y="546" font-size="12" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">helper.sh installs the ROCm PyTorch and MIOpen JIT headers the Kokoro server needs; the notebook starts it when the workshop switches to local TTS.</text></svg>