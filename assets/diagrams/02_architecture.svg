<rect x="0" y="0" width="900" height="470" rx="14" fill="#FFFFFF"/><text x="450.0" y="40" font-size="22" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">What one command starts for you</text><text x="450.0" y="64" font-size="14" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">bash helper.sh: the full observability backend, no manual setup</text><rect x="40" y="96" width="380" height="120" rx="12" fill="#FDECEC" stroke="#ED1C24" stroke-width="1.5" filter="url(#shadow)"/><text x="230" y="124" font-size="16" fill="#ED1C24" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Agent runtime</text><text x="230" y="150" font-size="15" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Hermes Agent</text><text x="230" y="172" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">vLLM · Muse-Glimmer-30B</text><text x="230" y="196" font-size="12.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">plans, reasons, picks and calls tools</text><rect x="480" y="96" width="380" height="120" rx="12" fill="#EAF2FB" stroke="#2E6DB4" stroke-width="1.5" filter="url(#shadow)"/><text x="670" y="124" font-size="16" fill="#2E6DB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Telemetry</text><text x="670" y="150" font-size="15" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">hermes-otel</text><text x="670" y="172" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">OTel spans + psutil CPU%</text><text x="670" y="196" font-size="12.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">+ AMD GPU metrics, every 0.1s</text><text x="450" y="146" font-size="10" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">instruments</text><line x1="420" y1="156" x2="480" y2="156" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="240" width="380" height="96" rx="12" fill="#E9F7F8" stroke="#1EAAB4" stroke-width="1.5" filter="url(#shadow)"/><text x="230" y="268" font-size="15" fill="#1EAAB4" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Kokoro TTS server</text><text x="230" y="292" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">FastAPI + Uvicorn on MI300X</text><text x="230" y="314" font-size="12.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">model stays resident in GPU memory</text><line x1="230" y1="216" x2="230" y2="240" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="292" y="232" font-size="11" fill="#5B6270" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">calls as a tool</text><rect x="480" y="240" width="380" height="96" rx="12" fill="#F4F5F7" stroke="#1A1A1A" stroke-width="1.5" filter="url(#shadow)"/><text x="670" y="268" font-size="15" fill="#1A1A1A" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">MLflow tracking server</text><text x="670" y="292" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">records every run :5004</text><text x="670" y="314" font-size="12.5" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">execution traces</text><text x="730" y="232" font-size="11" fill="#5B6270" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">records to</text><line x1="670" y1="216" x2="670" y2="240" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="220" y="372" width="460" height="78" rx="12" fill="#FDECEC" stroke="#ED1C24" stroke-width="1.5" filter="url(#shadow)"/><text x="450" y="400" font-size="16" fill="#ED1C24" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Telemetry dashboard  ·  Streamlit :8501</text><text x="450" y="426" font-size="13" fill="#5B6270" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">one clear view of the run: spans, CPU/GPU timeline, tool breakdown</text><line x1="600" y1="336" x2="480" y2="372" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="230" y1="336" x2="400" y2="372" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/></svg>